[project]
name = "graph-diagnostic"
version = "0.1.0"
description = "A diagnostic tool for GraphRAG systems that attributes answer-quality failures to specific graph-side causes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "pandas",
    "numpy",
    "networkx",
    "scikit-learn",
    "lightgbm",
    "shap",
    "sentence-transformers",
    "google-generativeai",
    "openai",
    "tqdm",
    "rapidfuzz",
    "huggingface-hub",
    "datasets",
    "pyarrow>=24.0.0",
    "google-genai>=1.74.0",
    "requests>=2.33.1",
    "matplotlib>=3.10.9",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.3.0",
]

[project.scripts]
graph_diagnostic = "graph_diagnostic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_diagnostic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=graph_diagnostic",
    "--cov-report=term-missing",
]
